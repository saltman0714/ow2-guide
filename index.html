<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>OW2 HERO GUIDE</title><style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151e31;--line:#28364d;--text:#eef3ff;--dim:#adbbd4;--acc:#ffb347}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1020,#101829);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:var(--text)}main{max-width:820px;margin:auto;padding:24px 14px 90px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:0;letter-spacing:.02em}h2{font-size:18px}small,.dim{color:var(--dim)}.pill{font-size:12px;background:#25344b;border-radius:100px;padding:7px 10px;color:#d8e4fa}.tabs{display:flex;gap:7px;overflow:auto;margin:22px 0 14px}.tabs button,button{border:1px solid var(--line);background:#172237;color:var(--text);border-radius:12px;padding:12px 15px;font-size:14px;cursor:pointer}.tabs button.active,.roles button.active{background:var(--acc);color:#1b2030;border-color:var(--acc);font-weight:700}.roles{display:flex;gap:6px;margin:12px 0}.roles button{padding:9px 11px;flex:1;font-size:13px}input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:#111a2a;color:white;font-size:16px;outline:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px;margin-top:14px}.card{background:var(--card);padding:15px;border:1px solid var(--line);border-radius:16px}.hero{display:flex;align-items:center;gap:12px}.hero img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#23334b}.hero strong{font-size:16px}.best{color:#ffc76c;font-weight:750}.meta{font-size:12px;color:var(--dim);margin:5px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.data{padding:12px;background:#101a2d;border-radius:10px;margin-top:10px;line-height:1.65;font-size:14px}.abilities{display:grid;gap:8px;margin-top:12px}.ability{padding:12px;border:1px solid var(--line);border-radius:10px}.ability img{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:8px}.empty{padding:32px;text-align:center;color:var(--dim)}a{color:#ffc76c}footer{margin:25px 2px;color:var(--dim);font-size:12px;line-height:1.7}.notice{background:#222c3c;border-left:3px solid var(--acc);padding:12px;border-radius:8px;font-size:13px;line-height:1.7;margin:14px 0}#status{font-size:12px;color:var(--dim)}@media(min-width:640px){h1{font-size:30px}}
</style></head><body><main><header><div><small>COUNTER & HERO DATA</small><h1>OW2 HERO GUIDE</h1></div><span class="pill" id="status">読み込み中</span></header><nav class="tabs" id="tabs"><button data-tab="counter" class="active">アンチピック</button><button data-tab="heroes">ヒーロー性能</button><button data-tab="patch">更新情報</button></nav><div id="search-bar"><input id="query" type="search" placeholder="ヒーロー名を検索" aria-label="ヒーロー名を検索" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div id="page"></div><footer>非公式ファン制作ツール。Blizzard Entertainmentとは無関係。アンチ候補は参考値。自動取得はHP・公式スキル説明等であり、武器の単発ダメージやDPSはデータ元にない場合は表示しない。</footer></main><script>
'use strict';const jp={dva:'D.Va',dmon:'D.Mon',domina:'ドミナ',doomfist:'ドゥームフィスト',hazard:'ハザード','junker-queen':'ジャンカー・クイーン',mauga:'マウガ',orisa:'オリーサ',ramattra:'ラマットラ',reinhardt:'ラインハルト',roadhog:'ロードホッグ',sigma:'シグマ',winston:'ウィンストン','wrecking-ball':'レッキング・ボール',zarya:'ザリア',anran:'アンラン',ashe:'アッシュ',bastion:'バスティオン',cassidy:'キャスディ',echo:'エコー',emre:'エムレ',freja:'フレイヤ',genji:'ゲンジ',hanzo:'ハンゾー',junkrat:'ジャンクラット',mei:'メイ',pharah:'ファラ',reaper:'リーパー',shion:'シオン',sierra:'シエラ',sojourn:'ソジョーン','soldier-76':'ソルジャー76',symmetra:'シンメトラ',torbjorn:'トールビョーン',tracer:'トレーサー',vendetta:'ヴェンデッタ',venture:'ベンチャー',widowmaker:'ウィドウメイカー',ana:'アナ',baptiste:'バティスト',brigitte:'ブリギッテ',doctrine:'ドクトリン',illari:'イラリー','jetpack-cat':'ジェットパック・キャット',juno:'ジュノ',kiriko:'キリコ',lifeweaver:'ライフウィーバー',lucio:'ルシオ',mercy:'マーシー',mizuki:'ミズキ',moira:'モイラ',sombra:'ソンブラ',wuyang:'ウーヤン',zenyatta:'ゼニヤッタ'};
const labels={tank:'タンク',damage:'ダメージ',support:'サポート'};let counters={},heroes=[],patch={},tab='counter',role='all',q='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=k=>jp[k]||k;const page=document.querySelector('#page');const asText=x=>x==null?'未取得':String(x);const img=url=>url&&/^https:\/\//.test(url)?`<img src="${esc(url)}" alt="" loading="lazy">`:'';
const findHero=k=>heroes.find(h=>h.key===k);function choose(t){tab=t;document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));render()}
document.querySelector('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)choose(b.dataset.tab)});
function controls(){return `<div class="roles">${[['all','すべて'],...Object.entries(labels)].map(([k,v])=>`<button data-role="${k}" class="${role===k?'active':''}">${v}</button>`).join('')}</div>`}
function match(k){return !q||(`${name(k)} ${k}`).toLowerCase().includes(q.toLowerCase())}
function render(){document.querySelector('#search-bar').hidden=tab==='patch';if(tab==='counter'){const entries=Object.entries(counters).filter(([k])=>labels[k]&&(role==='all'||role===k)).flatMap(([r,a])=>a.map(x=>({r,k:x[0],best:x[1],other:x[2]}))).filter(x=>match(x.k));page.innerHTML=`${controls()}<div class="dim">${entries.length}件のヒーロー</div><section class="cards">${entries.map(x=>{const h=findHero(x.k);return `<article class="card"><div class="hero">${img(h?.portrait)}<div><strong>${esc(name(x.k))}</strong><div class="meta">${labels[x.r]}</div></div></div><div class="data">有利候補：<span class="best">${esc(x.best)}</span><div class="meta">その他：${esc(x.other)}</div></div></article>`}).join('')||'<div class="empty">該当なし</div>'}</section><div class="notice">アンチピックは参考候補。自動で勝率や対面相性を更新する機能ではないよ。</div>`;bindControls();return}
if(tab==='heroes'){const all=Object.entries(counters).filter(([k])=>labels[k]&&(role==='all'||role===k)).flatMap(([r,a])=>a.map(x=>({r,k:x[0]}))).filter(x=>match(x.k));page.innerHTML=controls()+`<div class="dim">HP・スキルはOverFast APIから定期更新。記載のない武器ダメージは未取得。</div><section class="cards">${all.map(x=>{const h=findHero(x.k),hp=h?.hitpoints||{};return `<article class="card"><div class="hero">${img(h?.portrait)}<div><strong>${esc(name(x.k))}</strong><div class="meta">${labels[x.r]}</div></div></div><div class="data">HP：${esc(asText(hp.total))}　体力：${esc(asText(hp.health))}<div class="meta">アーマー：${esc(asText(hp.armor))}　シールド：${esc(asText(hp.shields))}</div></div><div class="abilities">${(h?.abilities||[]).map(a=>`<div class="ability">${img(a.icon)}<strong>${esc(a.name)}</strong><div class="meta">${esc(a.description||'説明未取得')}</div></div>`).join('')||'<div class="meta">スキルデータ未取得（初回の自動更新後に表示）</div>'}</div></article>`}).join('')}</section>`;bindControls();return}
page.innerHTML=`<div class="card"><h2>データ更新</h2><div class="data">ヒーローデータ取得日時：${esc(heroes.updated||window.heroUpdated||'未取得')}<br>パッチ確認日時：${esc(patch.checked||'未確認')}</div><p class="dim">${esc(patch.note||'')}</p><p><a href="${esc(patch.url||'https://overwatch.blizzard.com/en-us/news/patch-notes/')}" target="_blank" rel="noopener">公式パッチノートを開く</a></p>${patch.latest?`<div class="data">確認した記事：${esc(patch.latest)}</div>`:''}</div><div class="notice">毎日の自動チェックはGitHub Actionsが実行する。パッチ内容は確認できるけど、変更されたダメージの数値を無検証で書き換えることはしない。</div>`}
function bindControls(){page.querySelectorAll('[data-role]').forEach(el=>el.onclick=()=>{role=el.dataset.role;render()})}
const searchInput=document.querySelector('#query');let composing=false;searchInput.addEventListener('compositionstart',()=>{composing=true});searchInput.addEventListener('compositionend',()=>{composing=false;q=searchInput.value;render()});searchInput.addEventListener('input',()=>{q=searchInput.value;if(!composing)render()});
async function load(){const loadJSON=async f=>{try{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();return await r.json()}catch(e){return null}};const [c,h,p]=await Promise.all([loadJSON('./counters.json'),loadJSON('./heroes.json'),loadJSON('./patch.json')]);counters=c||{};heroes=h?.heroes||[];window.heroUpdated=h?.updated;patch=p||{};document.querySelector('#status').textContent=h?.updated?'自動更新：'+h.updated.slice(0,10):'初回同期待ち';render()}load();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
